<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Offline - Journaling</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; background: #f8fafc; color: #0f172a;
    font: 500 16px/1.45 Figtree, ui-sans-serif, system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  main { max-width: 320px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { margin: 4px 0 0; font-size: 20px; font-weight: 600; }
  p { margin: 0; font-size: 14px; color: #475569; }
  button { margin-top: 8px; height: 48px; padding: 0 24px; border: none; border-radius: 12px; background: #2563eb; color: #fff; font: 600 16px/1 inherit; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>Kamu sedang offline</h1>
  <p>Journaling butuh koneksi internet untuk membuka dan menyimpan catatan. Coba lagi setelah sinyal kembali.</p>
  <button type="button" onclick="location.reload()">Coba lagi</button>
</main>
</body>
</html>
